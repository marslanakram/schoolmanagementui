
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
  data-sidebar-position="fixed" data-header-position="fixed">

  <div class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="d-flex align-items-center justify-content-center w-100">
      <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6 col-xxl-3">
          <div class="card mb-0">
            <div class="card-body">

             
              <a href="./index.html" class="text-nowrap logo-img text-center d-block py-3 w-100">
                <img src="./assets/images/logos/logo.svg" alt="Logo">
              </a>

              <p class="text-center">Your Social Campaigns</p>

          
              <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

              
                <div class="mb-3">
                  <label for="emailInput" class="form-label">Email</label>
                  <input id="emailInput" type="email" class="form-control" formControlName="email" placeholder="Email address">
                  <div class="text-danger mt-1" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                    Please enter a valid email address.
                  </div>
                </div>

               
                <div class="mb-4">
                  <label for="passwordInput" class="form-label">Password</label>
                  <input id="passwordInput" type="password" class="form-control" formControlName="password" placeholder="Password">
                  <div class="text-danger mt-1" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                    Password is required.
                  </div>
                </div>

                
                <div class="d-flex align-items-center justify-content-between mb-4">
                  <div class="form-check">
                    <input class="form-check-input primary" type="checkbox" id="flexCheckChecked" checked>
                    <label class="form-check-label text-dark" for="flexCheckChecked">
                      Remember this Device
                    </label>
                  </div>
                  <a class="text-primary fw-bold" href="./index.html">Forgot Password?</a>
                </div>

              
                <button class="btn btn-primary w-100 py-2 fs-4 mb-4 rounded-2" type="submit" [disabled]="isLoading">
                  <span *ngIf="!isLoading">Sign In</span>
                  <span *ngIf="isLoading">Signing In...</span>
                </button>

               
                <div *ngIf="errorMessage" class="text-center text-danger mb-2">
                  {{ errorMessage }}
                </div>

                
                <div class="d-flex align-items-center justify-content-center">
                  <p class="fs-4 mb-0 fw-bold">New to MaterialM?</p>
                  <a class="text-primary fw-bold ms-2" href="./authentication-register.html">Create an account</a>
                </div>

              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
