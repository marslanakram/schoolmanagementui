<!-- App body starts -->
<div class="app-body">

  <!-- Row starts -->
  <div class="row gx-3">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="card-title">Users List</h5>
          <a routerLink="/users/add" class="btn btn-primary ms-auto">Add User</a>
        </div>
        <div class="card-body">

          <!-- Table starts -->
          <div class="table-responsive">
            <table id="usersTable" class="table truncate m-0 align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>User</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Date of Birth</th>
                  <th>Role</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of users">
                  <td>{{ user.id }}</td>
                  <td>
                    <img src="assets/images/user.png" class="img-shadow img-2x rounded-5 me-1"
                      alt="User Image">
                  </td>
                  <td>{{ user.firstName }} {{ user.lastName }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.phoneNumber }}</td>
                  <td>{{ user.address }}</td>
                  <td>{{ user.dateOfBirth | date }}</td>
                  <td>
                    <span [ngClass]="{
                      'badge bg-info-subtle text-info': user.role === 'Admin',
                      'badge bg-success-subtle text-success': user.role === 'Teacher',
                      'badge bg-warning-subtle text-warning': user.role === 'Manager'
                    }">
                      {{ user.role }}
                    </span>
                  </td>
                  <td>
                    <div class="d-inline-flex gap-1">
                      <button class="btn btn-outline-danger btn-sm" (click)="deleteUser(user.id)">
                        <i class="ri-delete-bin-line"></i>
                      </button>
                      <a [routerLink]="['/users/edit', user.id]" class="btn btn-outline-success btn-sm"
                        data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Edit User Details">
                        <i class="ri-edit-box-line"></i>
                      </a>
                      <!-- <a [routerLink]="['/users/view', user.id]" class="btn btn-outline-info btn-sm"
                        data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="View User Details">
                        <i class="ri-eye-line"></i>
                      </a> -->
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- Table ends -->

          <!-- Delete Confirmation Modal -->
          <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-sm">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="deleteUserModalLabel">
                    Confirm Deletion
                  </h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  Are you sure you want to delete this user?
                </div>
                <div class="modal-footer">
                  <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
  <!-- Row ends -->

</div>
<!-- App body ends -->
