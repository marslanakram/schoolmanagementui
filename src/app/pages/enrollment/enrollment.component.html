<div class="app-body">
  <div class="row gx-3">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="card-title">Enrollment List</h5>
          <button class="btn btn-primary ms-auto" (click)="openAddModal()">Add Enrollment</button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table truncate m-0 align-middle">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Class</th>
                  <th>Enrollment Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of enrollments">
                  <td>{{ getStudentNameById(item.studentId) }}</td>
                  <td>{{ getClassNameById(item.classId) }}</td>
                  <td>{{ item.enrollmentDate | date }}</td>
                  <td>
                    <span [ngClass]="item.isActive ? 'badge bg-success-subtle text-success' : 'badge bg-danger-subtle text-danger'">
                      {{ item.isActive ? 'Active' : 'Inactive' }}
                    </span>
                  </td>
                  <td>
                    <div class="d-inline-flex gap-1">
                      <button class="btn btn-outline-success btn-sm" (click)="openEditModal(item)">
                        <i class="ri-edit-box-line"></i>
                      </button>
                      <button class="btn btn-outline-danger btn-sm" (click)="confirmDelete(item.id)">
                        <i class="ri-delete-bin-line"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Add/Edit Modal -->
          <div class="modal fade" id="enrollmentModal" tabindex="-1" aria-labelledby="enrollmentModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-md">
              <div class="modal-content">
                <form (ngSubmit)="submitEnrollment()">
                  <div class="modal-header">
                    <h5 class="modal-title">{{ isEditMode ? 'Edit' : 'Add' }} Enrollment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Student</label>
                      <select class="form-select" [(ngModel)]="enrollment.studentId" name="studentId" required>
                        <option value="">Select Student</option>
                        <option *ngFor="let student of students" [value]="student.id">
                          {{ student.firstName }} {{ student.lastName }} ({{ student.rollNumber }})
                        </option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Class</label>
                      <select class="form-select" [(ngModel)]="enrollment.classId" name="classId" required>
                        <option value="">Select Class</option>
                        <option *ngFor="let cls of classes" [value]="cls.id">
                          {{ cls.name }}
                        </option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Enrollment Date</label>
                      <input type="date" class="form-control" [(ngModel)]="enrollment.enrollmentDate" name="enrollmentDate" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Status</label>
                      <select class="form-select" [(ngModel)]="enrollment.isActive" name="isActive" required>
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                      </select>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Update' : 'Add' }}</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
